<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CIBA Approval Device (Simulated)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body { background: #0a1330; color: #fff; min-height: 100vh; }
        .card { background: #ffffff; color: #111; }
        #waiting { color: #9fc7ff; }
    </style>
</head>
<body>
<div class="container py-5" style="max-width: 640px;">
    <h1 class="mb-1">CIBA Approval Device</h1>
    <p class="text-white-50 mb-4">Simulated Authentication Device — plays the role of a phone showing a push-approval prompt.</p>

    <div id="waiting" class="mb-4">
        <div class="spinner-border spinner-border-sm me-2" role="status"></div>
        Waiting for a CIBA request from Keycloak&hellip;
    </div>

    <div id="pendingCard" class="card shadow-sm d-none">
        <div class="card-body">
            <h5 class="card-title">Approval requested</h5>
            <p class="mb-1"><strong>User:</strong> <span id="loginHint">-</span></p>
            <p class="mb-1"><strong>Scope:</strong> <span id="scope">-</span></p>
            <p class="mb-3"><strong>Message:</strong> <span id="bindingMessage">-</span></p>
            <button id="approveBtn" class="btn btn-success me-2">Approve</button>
            <button id="denyBtn" class="btn btn-outline-danger">Deny</button>
        </div>
    </div>

    <div id="resultAlert" class="alert mt-4 d-none" role="alert"></div>
</div>

<script>
    const waitingEl = document.getElementById('waiting');
    const pendingCard = document.getElementById('pendingCard');
    const resultAlert = document.getElementById('resultAlert');

    function showResult(message, isError) {
        resultAlert.textContent = message;
        resultAlert.className = 'alert mt-4 ' + (isError ? 'alert-danger' : 'alert-success');
    }

    async function poll() {
        try {
            const res = await fetch('/ciba/pending');
            const data = await res.json();
            if (data.pending) {
                waitingEl.classList.add('d-none');
                pendingCard.classList.remove('d-none');
                document.getElementById('loginHint').textContent = data.loginHint || '(none)';
                document.getElementById('scope').textContent = data.scope || '(none)';
                document.getElementById('bindingMessage').textContent = data.bindingMessage || '(none)';
            } else {
                waitingEl.classList.remove('d-none');
                pendingCard.classList.add('d-none');
            }
        } catch (err) {
            console.error('Poll failed', err);
        }
    }

    async function decide(action) {
        try {
            const res = await fetch('/ciba/' + action, { method: 'POST' });
            const text = await res.text();
            showResult(text, !res.ok);
            pendingCard.classList.add('d-none');
        } catch (err) {
            showResult('Request failed: ' + err, true);
        }
    }

    document.getElementById('approveBtn').addEventListener('click', () => decide('approve'));
    document.getElementById('denyBtn').addEventListener('click', () => decide('deny'));

    poll();
    setInterval(poll, 2000);
</script>
</body>
</html>
