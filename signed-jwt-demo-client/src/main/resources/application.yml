spring:
  application:
    name: signed-jwt-demo-client
  main:
    web-application-type: none

# --- Keycloak realm / client settings ---------------------------------------
keycloak:
  base-url: http://localhost:8080
  realm: jpa-demo-realm
  client-id: signed-jwt-client
  # Audience claim for the assertion JWT. Per OIDC Core's ClientAuthentication
  # section, the recommended value is the Authorization Server's token
  # endpoint URL (what's used below). Keycloak also accepts its issuer URL
  # (http://localhost:8080/realms/jpa-demo-realm) as a fallback if the token
  # endpoint URL is ever rejected — see the README's troubleshooting section.
  token-endpoint: http://localhost:8080/realms/jpa-demo-realm/protocol/openid-connect/token
  userinfo-endpoint: http://localhost:8080/realms/jpa-demo-realm/protocol/openid-connect/userinfo

# --- Local keystore holding this client's RSA keypair ------------------------
# Generated by the keytool command in README.md. Keycloak is given the PUBLIC
# certificate only (via its client Keys tab); the PRIVATE key never leaves
# this file / this app.
signed-jwt:
  keystore-path: keys/signed-jwt-client-keystore.p12
  keystore-password: changeit
  key-alias: signed-jwt-client
  key-password: changeit
  # How long the client assertion JWT itself is valid for, in seconds.
  # Short-lived by design — RFC 7523 assertions are meant to be single-use,
  # not a long-lived credential like a client secret.
  assertion-lifetime-seconds: 60

logging:
  level:
    com.rollingstone.signedjwt: info
