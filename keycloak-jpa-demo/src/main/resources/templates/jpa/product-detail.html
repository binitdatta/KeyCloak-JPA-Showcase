<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${product.productName} + ' | JPA Lab'">Product</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/bright-blue.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <a href="/jpa/products" class="btn btn-sm btn-outline-secondary mb-3">&laquo; Back to Products</a>
    <h1 th:text="${product.productName}">Product Name</h1>
    <p class="text-muted" th:text="${product.description}">Description</p>
    <p><strong>Category (many:one):</strong> <span th:text="${product.category.categoryName}">Category</span></p>
    <p><strong>Price:</strong> <span th:text="${'$' + product.unitPrice}">$0.00</span> &middot;
        <strong>Stock:</strong> <span th:text="${product.stockQuantity}">0</span></p>

    <h5 class="mt-4">Tags (many:many <span class="code-pill">Product.tags</span> &harr; <span class="code-pill">Tag.products</span>)</h5>
    <div>
        <span class="badge badge-audience me-1" th:each="t : ${product.tags}" th:text="${t.tagName}">tag</span>
        <span class="text-muted" th:if="${product.tags.isEmpty()}">No tags</span>
    </div>
</div>
</body>
</html>
