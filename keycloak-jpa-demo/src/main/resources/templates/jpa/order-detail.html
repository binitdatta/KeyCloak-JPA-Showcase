<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${order.orderNumber} + ' | JPA Lab'">Order</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/bright-blue.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <a th:href="@{/jpa/customers/{id}(id=${order.customer.customerId})}" class="btn btn-sm btn-outline-secondary mb-3">&laquo; Back to Customer</a>
    <h1 th:text="${order.orderNumber}">ORD-2026-0001</h1>
    <p class="text-muted">Status: <span th:text="${order.orderStatus}">CREATED</span> &middot; Total:
        <span th:text="${'$' + order.orderTotal}">$0.00</span></p>

    <div class="card card-accent-top mb-4" th:if="${order.payment != null}">
        <div class="card-body">
            <h5 class="card-title">Payment (1:1 <span class="code-pill">Order.payment</span>)</h5>
            <p class="mb-1"><strong>Method:</strong> <span th:text="${order.payment.paymentMethod}">CREDIT_CARD</span></p>
            <p class="mb-1"><strong>Status:</strong> <span th:text="${order.payment.paymentStatus}">CAPTURED</span></p>
            <p class="mb-0"><strong>Amount:</strong> <span th:text="${'$' + order.payment.amountCharged}">$0.00</span></p>
        </div>
    </div>

    <h5 class="mt-4">Line Items (1:many <span class="code-pill">Order.items</span>, each many:one <span class="code-pill">Product</span>)</h5>
    <table class="table table-hover bg-white shadow-sm">
        <thead class="table-dark">
        <tr><th>Product</th><th>Qty</th><th>Unit Price</th><th>Line Total</th></tr>
        </thead>
        <tbody>
        <tr th:each="i : ${order.items}">
            <td th:text="${i.product.productName}">Product</td>
            <td th:text="${i.quantity}">1</td>
            <td th:text="${'$' + i.unitPriceAtPurchase}">$0.00</td>
            <td th:text="${'$' + i.lineTotal}">$0.00</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
