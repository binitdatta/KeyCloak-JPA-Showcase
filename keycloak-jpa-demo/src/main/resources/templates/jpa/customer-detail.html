<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${customer.firstName + ' ' + customer.lastName} + ' | JPA Lab'">Customer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/bright-blue.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <a href="/jpa/customers" class="btn btn-sm btn-outline-secondary mb-3">&laquo; Back to Customers</a>
    <h1 th:text="${customer.firstName + ' ' + customer.lastName}">Customer Name</h1>
    <p class="text-muted" th:text="${customer.email}">email@example.com</p>

    <div class="card card-accent-top mb-4" th:if="${customer.profile != null}">
        <div class="card-body">
            <h5 class="card-title">Profile (1:1 <span class="code-pill">customer_profiles</span>)</h5>
            <p class="mb-1"><strong>Loyalty tier:</strong> <span th:text="${customer.profile.loyaltyTier}">GOLD</span></p>
            <p class="mb-1"><strong>Phone:</strong> <span th:text="${customer.profile.phoneNumber}">-</span></p>
            <p class="mb-0"><strong>Ships to:</strong>
                <span th:text="${customer.profile.shippingAddressLine1 + ', ' + customer.profile.city + ', ' + customer.profile.stateCode}">-</span>
            </p>
        </div>
    </div>

    <h5 class="mt-4">Orders (1:many <span class="code-pill">Customer.orders</span>)</h5>
    <table class="table table-hover bg-white shadow-sm">
        <thead class="table-dark">
        <tr><th>Order #</th><th>Status</th><th>Total</th><th>Placed</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="o : ${customer.orders}">
            <td th:text="${o.orderNumber}">ORD-1</td>
            <td th:text="${o.orderStatus}">CREATED</td>
            <td th:text="${'$' + o.orderTotal}">$0.00</td>
            <td th:text="${o.placedAt}">-</td>
            <td><a class="btn btn-sm btn-brightblue" th:href="@{/jpa/orders/{id}(id=${o.orderId})}">View Items</a></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
