<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Customers | JPA Lab</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/bright-blue.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <h1 class="mb-1">Customers</h1>
    <p class="text-muted">Each row's profile column comes from the <span class="code-pill">customer_profiles</span>
        table via the <strong>1:1</strong> <span class="code-pill">Customer.profile</span> association.</p>

    <table class="table table-hover bg-white shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Loyalty Tier (via 1:1 profile)</th>
            <th>City</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${customers}">
            <td th:text="${c.customerId}">1</td>
            <td th:text="${c.firstName + ' ' + c.lastName}">Jane Doe</td>
            <td th:text="${c.email}">jane@example.com</td>
            <td>
                <span class="badge badge-audience" th:if="${c.profile != null}" th:text="${c.profile.loyaltyTier}">GOLD</span>
                <span class="text-muted" th:if="${c.profile == null}">no profile row</span>
            </td>
            <td th:text="${c.profile != null ? c.profile.city : '-'}">Chicago</td>
            <td><a class="btn btn-sm btn-brightblue" th:href="@{/jpa/customers/{id}(id=${c.customerId})}">View Orders</a></td>
        </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
