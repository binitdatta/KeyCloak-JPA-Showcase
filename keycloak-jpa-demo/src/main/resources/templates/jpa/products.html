<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Products | JPA Lab</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/bright-blue.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <h1 class="mb-1">Products</h1>
    <p class="text-muted">Category comes from <strong>many:one</strong> <span class="code-pill">Product.category</span>;
        tags come from the <strong>many:many</strong> <span class="code-pill">Product.tags</span> join table
        <span class="code-pill">product_tags</span>.</p>

    <table class="table table-hover bg-white shadow-sm">
        <thead class="table-dark">
        <tr><th>SKU</th><th>Name</th><th>Category</th><th>Price</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="p : ${products}">
            <td th:text="${p.sku}">SKU-1</td>
            <td th:text="${p.productName}">Product</td>
            <td th:text="${p.category.categoryName}">Category</td>
            <td th:text="${'$' + p.unitPrice}">$0.00</td>
            <td><a class="btn btn-sm btn-brightblue" th:href="@{/jpa/products/{id}(id=${p.productId})}">View Tags</a></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
